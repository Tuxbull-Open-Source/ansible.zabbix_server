name: Role tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Ansible and YAML parser
        run: python -m pip install 'ansible-core>=2.15,<2.21' 'PyYAML>=6,<7'
      - name: Download and verify audit artifacts
        run: tests/bootstrap-audit-artifacts.sh
      - name: Run role contracts
        run: python3 tests/run.py
      - name: Check whitespace
        run: git diff --check
