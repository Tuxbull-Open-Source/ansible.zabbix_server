name: Role tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Ansible and YAML parser
        run: python -m pip install 'ansible-core>=2.15,<2.21' 'PyYAML>=6,<7'
      - name: Install locked Ansible collections
        run: ansible-galaxy collection install -r requirements.yml -p collections --force
      - name: Download and verify audit artifacts
        run: tests/bootstrap-audit-artifacts.sh
      - name: Run role contracts
        run: python3 tests/run.py
      - name: Check whitespace
        run: git diff --check
